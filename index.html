<!DOCTYPE html>
<html lang="it">

<head>
    <!-- Collegamento al Manifest della PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8DA1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bambocchan Care</title>

    <!-- Unica risorsa esterna: font Nunito e icone Material Symbols Rounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
        rel="stylesheet">

    <style>
        /* === VARIABILI (colori, font, raggi, ombre) === */
        :root {
            --color-page: #f3ece3;
            /* sfondo fuori dall'app (schermi grandi) */
            --color-bg: #fbf7f1;
            /* sfondo dell'app */
            --color-card: #ffffff;
            /* sfondo delle card */
            --color-text: #2a2422;
            /* testo principale */
            --color-text-soft: #6f6560;
            /* testo secondario */
            --color-rose: #d4808c;
            /* rosa principale */
            --color-rose-soft: #fdeef0;
            /* rosa chiaro (sfondi) */
            --color-gold: #d79a5b;
            /* arancio/oro per le etichette */
            --color-gold-soft: #fbf1e4;
            /* oro chiaro (sfondi) */
            --color-track: #f0e8e1;
            /* barre vuote */
            --color-border: #f3e9e4;
            /* bordi leggeri */

            --font-main: "Nunito", system-ui, sans-serif;

            --radius-card: 20px;
            --radius-box: 16px;
            --radius-pill: 999px;

            --shadow-card: 0 4px 14px rgba(120, 90, 70, 0.08);
            --shadow-button: 0 6px 16px rgba(212, 128, 140, 0.35);
        }

        /* === BASE === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            color: var(--color-text);
            background: var(--color-page);
        }

        button {
            font-family: inherit;
            border: none;
            background: none;
            cursor: pointer;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* Classe per le icone Material Symbols */
        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            display: inline-block;
            user-select: none;
        }

        /* === CONTENITORE APP (max 420px, centrato) === */
        .app {
            max-width: 420px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px 18px 28px;
            background: var(--color-bg);
        }

        /* === HEADER === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
        }

        .header__title {
            font-size: 26px;
            font-weight: 800;
        }

        .header__subtitle {
            margin-top: 4px;
            font-size: 16px;
            color: var(--color-text-soft);
        }

        .header__profile {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--color-card);
            color: var(--color-rose);
            box-shadow: var(--shadow-card);
        }

        /* === SELETTORE GIORNI === */
        .days {
            display: flex;
            gap: 6px;
            margin-top: 22px;
        }

        .day {
            flex: 1;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border-radius: var(--radius-box);
            background: var(--color-card);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
            font-size: 12px;
            color: var(--color-text-soft);
        }

        .day__number {
            font-size: 17px;
            font-weight: 700;
            color: var(--color-text);
        }

        /* Giorno attivo: rosa pieno */
        .day.is-active {
            background: var(--color-rose);
            border-color: var(--color-rose);
            color: #ffffff;
        }

        .day.is-active .day__number {
            color: #ffffff;
        }

        /* === CARD PROGRESSO === */
        .progress {
            margin-top: 20px;
            padding: 18px 18px 20px;
            border-radius: var(--radius-card);
            background: var(--color-card);
            box-shadow: var(--shadow-card);
        }

        .progress__top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-gold);
        }

        .progress__badge {
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            background: var(--color-rose-soft);
            color: var(--color-rose);
            font-size: 13px;
            font-weight: 800;
        }

        .progress__middle {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 14px;
        }

        .progress__counter {
            font-size: 21px;
            font-weight: 800;
        }

        .progress__day {
            font-size: 14px;
            color: var(--color-text-soft);
        }

        /* Barre a segmenti (una per ogni prodotto) */
        .progress__bar {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .progress__segment {
            flex: 1;
            height: 8px;
            border-radius: var(--radius-pill);
            background: var(--color-track);
        }

        .progress__segment.is-filled {
            background: var(--color-rose);
        }

        /* === CHECKLIST === */
        .checklist {
            margin-top: 24px;
        }

        .checklist__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .checklist__title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text-soft);
        }

        .checklist__today {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-rose);
        }

        .checklist__list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Singola card prodotto */
        .product {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: var(--radius-card);
            background: var(--color-card);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
        }

        .product__info {
            flex: 1;
            min-width: 0;
        }

        /* min-width serve per tagliare il testo lungo con "..." */
        .product__category {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--color-gold);
        }

        .product__name {
            margin-top: 2px;
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product__meta {
            margin-top: 4px;
            font-size: 13px;
            color: var(--color-text-soft);
        }

        .product__dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            margin: 0 4px 2px;
            border-radius: 50%;
            background: var(--color-text-soft);
        }

        .product__menu {
            color: var(--color-text-soft);
            display: flex;
        }

        /* Riquadro icona del prodotto */
        .product__icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 24px;
        }

        .product__icon--pink {
            background: var(--color-rose-soft);
            color: var(--color-rose);
        }

        .product__icon--gold {
            background: var(--color-gold-soft);
            color: var(--color-gold);
        }

        /* Checkbox personalizzata: l'input vero è nascosto, si vede solo il cerchio */
        .check {
            cursor: pointer;
            display: flex;
        }

        .check__input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .check__circle {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #f1d9dc;
            color: transparent;
            /* spunta invisibile quando non usato */
            font-size: 16px;
            transition: background 0.15s, border-color 0.15s;
        }

        .check__input:checked+.check__circle {
            background: var(--color-rose);
            border-color: var(--color-rose);
            color: #ffffff;
            /* spunta visibile quando usato */
        }

        /* Accessibilità: bordo visibile quando si naviga con la tastiera */
        .check__input:focus-visible+.check__circle {
            outline: 2px solid var(--color-rose);
            outline-offset: 2px;
        }

        /* Card prodotto "usato" */
        .product.is-done {
            border-color: #f3ccd1;
        }

        /* === NOME PRODOTTO MODIFICABILE === */
        .name-input {
            display: block;
            width: 100%;
            font-family: inherit;
            color: inherit;
            background: transparent;
            border: none;
            border-bottom: 1px dashed transparent;
            /* invisibile finché non ci passi sopra */
            padding: 0;
        }

        .name-input:hover {
            border-bottom-color: var(--color-border);
        }

        .name-input:focus {
            outline: none;
            border-bottom: 1px solid var(--color-rose);
        }

        /* === SELETTORE ORARIO === */
        .time-input {
            font-family: inherit;
            font-size: 13px;
            color: var(--color-text-soft);
            background: var(--color-rose-soft);
            border: none;
            border-radius: 8px;
            padding: 2px 6px;
            cursor: pointer;
        }

        /* === PULSANTE AGGIUNGI === */
        .add-button {
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            border-radius: var(--radius-pill);
            background: var(--color-rose);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            box-shadow: var(--shadow-button);
        }

        .add-button:active {
            transform: scale(0.98);
        }

        /* === PULSANTE NOTIFICHE === */
        .notify-button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: var(--radius-pill);
            background: var(--color-card);
            border: 2px solid var(--color-rose);
            color: var(--color-rose);
            font-size: 15px;
            font-weight: 800;
        }

        .notify-button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        /* === FINESTRA "NUOVO PRODOTTO" === */
        .dialog {
            margin: auto;
            /* serve per centrarla (il reset in alto lo azzera) */
            width: calc(100% - 36px);
            max-width: 380px;
            padding: 22px 20px;
            border: none;
            border-radius: var(--radius-card);
            background: var(--color-card);
            color: var(--color-text);
            font-family: inherit;
            box-shadow: 0 10px 30px rgba(42, 36, 34, 0.25);
        }

        .dialog::backdrop {
            background: rgba(42, 36, 34, 0.45);
        }

        .dialog__title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .field {
            display: block;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--color-text-soft);
        }

        .field__input {
            display: block;
            width: 100%;
            margin-top: 4px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 15px;
            color: var(--color-text);
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 12px;
        }

        .field__input:focus {
            outline: 2px solid var(--color-rose);
            border-color: transparent;
        }

        .dialog__buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .dialog__button {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-pill);
            border: 2px solid var(--color-rose);
            color: var(--color-rose);
            font-size: 15px;
            font-weight: 800;
        }

        .dialog__button--primary {
            background: var(--color-rose);
            color: #ffffff;
        }

        /* === PROMEMORIA === */
        .reminder {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding: 14px;
            border-radius: var(--radius-box);
            background: #fdf4e8;
            border: 1px solid #f3e3cf;
            font-size: 15px;
            font-weight: 600;
        }

        .reminder__icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--color-card);
            font-size: 20px;
        }

        /* === MESSAGGIO LISTA VUOTA === */
        .empty-message {
            padding: 22px 14px;
            text-align: center;
            font-size: 14px;
            color: var(--color-text-soft);
            background: var(--color-card);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-card);
        }
    </style>
</head>

<body>
    <!-- Contenitore principale dell'app -->
    <div class="app">

        <!-- === HEADER: titolo, saluto e pulsante profilo === -->
        <header class="header">
            <div>
                <h1 class="header__title">Bambocchan Care</h1>
                <p class="header__subtitle">salve, cucciola!</p>
            </div>
            <button class="header__profile" aria-label="Profilo">
                <span class="material-symbols-rounded">person</span>
            </button>
        </header>

        <main>
            <!-- === SELETTORE GIORNI: un pulsante per ogni giorno (i numeri li scrive il JavaScript) === -->
            <section class="days" aria-label="Giorni della settimana">
                <button class="day"><span>Lun</span><span class="day__number"></span></button>
                <button class="day"><span>Mar</span><span class="day__number"></span></button>
                <button class="day"><span>Mer</span><span class="day__number"></span></button>
                <button class="day"><span>Gio</span><span class="day__number"></span></button>
                <button class="day"><span>Ven</span><span class="day__number"></span></button>
                <button class="day"><span>Sab</span><span class="day__number"></span></button>
                <button class="day"><span>Dom</span><span class="day__number"></span></button>
            </section>

            <!-- === CARD PROGRESSO: contatore, percentuale e barre (le barre le crea il JavaScript) === -->
            <section class="progress" aria-label="Progresso beauty routine">
                <div class="progress__top">
                    <h2 class="label">Progresso beauty routine</h2>
                    <span class="progress__badge" id="percent-text">0%</span>
                </div>
                <div class="progress__middle">
                    <p class="progress__counter" id="counter-text">0 / 0 prodotti usati</p>
                    <p class="progress__day" id="day-name"></p>
                </div>
                <div class="progress__bar" id="progress-bar"></div>
            </section>

            <!-- === CHECKLIST GIORNALIERA (le card dei prodotti le crea il JavaScript) === -->
            <section class="checklist" aria-label="Checklist giornaliera">
                <div class="checklist__header">
                    <h2 class="checklist__title">Checklist giornaliera</h2>
                    <span class="checklist__today" id="today-label">Oggi</span>
                </div>

                <ul class="checklist__list" id="product-list"></ul>
            </section>

            <!-- === PULSANTE AGGIUNGI PRODOTTO === -->
            <button class="add-button" id="add-button">+ Aggiungi / Scansiona prodotto</button>

            <!-- === PULSANTE NOTIFICHE === -->
            <button class="notify-button" id="notify-button">🔔 Attiva notifiche</button>

            <!-- === PROMEMORIA === -->
            <section class="reminder" aria-label="Promemoria">
                <span class="reminder__icon">🔔</span>
                <p>Occhio bamboccia: Domani ore 21:30 - Scrub Capelli</p>
            </section>
        </main>
    </div>

    <!-- === FINESTRA "NUOVO PRODOTTO": si apre con il pulsante Aggiungi === -->
    <dialog class="dialog" id="add-dialog" aria-labelledby="dialog-title">
        <form id="add-form">
            <h2 class="dialog__title" id="dialog-title">Nuovo prodotto</h2>

            <label class="field">Nome del prodotto
                <input class="field__input" type="text" id="new-name" maxlength="40" required
                    placeholder="Es. Crema notte">
            </label>

            <label class="field">Marca (facoltativa)
                <input class="field__input" type="text" id="new-brand" maxlength="25" placeholder="Es. CeraVe">
            </label>

            <label class="field">Categoria
                <select class="field__input" id="new-category"></select>
            </label>

            <label class="field">Orario
                <input class="field__input" type="time" id="new-time" value="08:00" required>
            </label>

            <div class="dialog__buttons">
                <button type="button" class="dialog__button" id="cancel-button">Annulla</button>
                <button type="submit" class="dialog__button dialog__button--primary">Aggiungi</button>
            </div>
        </form>
    </dialog>

    <script>
        /* === ELEMENTI DELLA PAGINA === */
        // Prendiamo una volta sola gli elementi fissi della pagina
        const dayButtons = document.querySelectorAll('.day');
        const productList = document.querySelector('#product-list');
        const progressBar = document.querySelector('#progress-bar');
        const counterText = document.querySelector('#counter-text');
        const percentText = document.querySelector('#percent-text');
        const dayNameText = document.querySelector('#day-name');
        const todayLabel = document.querySelector('#today-label');
        const addButton = document.querySelector('#add-button');
        const notifyButton = document.querySelector('#notify-button');

        // Elementi della finestra "Nuovo prodotto"
        const addDialog = document.querySelector('#add-dialog');
        const addForm = document.querySelector('#add-form');
        const cancelButton = document.querySelector('#cancel-button');
        const newName = document.querySelector('#new-name');
        const newBrand = document.querySelector('#new-brand');
        const newCategory = document.querySelector('#new-category');
        const newTime = document.querySelector('#new-time');

        // Chiave del giorno selezionato (es. "2026-10-16"): serve per salvare le spunte di quel giorno
        let selectedDayKey = '';

        // Ricorda le notifiche già inviate, per non mandarle due volte
        const sentNotifications = [];

        /* === DATI: CATEGORIE E PRODOTTI === */
        // Ogni categoria ha un'icona e un colore (pink = rosa, gold = oro)
        const categories = [
            { name: 'Detersione viso', icon: 'clean_hands', color: 'pink' },
            { name: 'Trattamento', icon: 'water_drop', color: 'gold' },
            { name: 'Idratazione', icon: 'light_mode', color: 'pink' },
            { name: 'Cura labbra', icon: 'bedtime', color: 'gold' },
            { name: 'Capelli', icon: 'spa', color: 'pink' },
            { name: 'Altro', icon: 'favorite', color: 'gold' }
        ];

        // Prodotti di partenza (si usano solo la prima volta, finché non salvi nulla)
        const defaultProducts = [
            { id: 'p1', category: 'Detersione viso', name: 'Mousse detergente delicata', brand: 'CeraVe', time: '08:15' },
            { id: 'p2', category: 'Trattamento', name: 'Siero Vitamina C illuminante', brand: 'The Ordinary', time: '08:20' },
            { id: 'p3', category: 'Idratazione', name: 'Crema giorno idratante SPF 30', brand: 'La Roche-Posay', time: '08:30' },
            { id: 'p4', category: 'Cura labbra', name: 'Balsamo labbra nutriente notte', brand: 'Laneige', time: '22:00' }
        ];

        // La lista dei prodotti in uso (viene riempita da loadProducts)
        let products = [];

        // Salva la lista dei prodotti nel browser (localStorage salva solo testo, quindi JSON.stringify)
        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        // Legge i prodotti salvati; se non c'è nulla usa quelli di partenza
        function loadProducts() {
            const savedText = localStorage.getItem('products');

            if (savedText === null) {
                products = defaultProducts;
            } else {
                products = JSON.parse(savedText); // da testo a lista
            }
        }

        // Trova la categoria dal nome (se non la trova usa l'ultima, "Altro")
        function getCategory(name) {
            const found = categories.find(function (category) {
                return category.name === name;
            });

            if (found === undefined) {
                return categories[categories.length - 1];
            }
            return found;
        }

        // Trova un prodotto dal suo id
        function getProductById(id) {
            return products.find(function (product) {
                return product.id === id;
            });
        }

        /* === DATE === */
        // Nomi dei giorni: getDay() restituisce 0 per domenica, 1 per lunedì, ... 6 per sabato
        const dayNames = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

        // Trova la data del lunedì della settimana in corso
        function getMonday(today) {
            const daysSinceMonday = (today.getDay() + 6) % 7; // lunedì = 0, ... domenica = 6
            const monday = new Date(today);
            monday.setDate(today.getDate() - daysSinceMonday);
            return monday;
        }

        // Crea la chiave di OGGI (stessa forma di quella dei pulsanti dei giorni)
        function getTodayKey() {
            const today = new Date();
            return today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();
        }

        // Scrive nei 7 pulsanti i numeri dei giorni reali e attiva quello di oggi
        function setupWeek() {
            const today = new Date();
            const monday = getMonday(today);

            dayButtons.forEach(function (button, index) {
                // Data di questo pulsante = lunedì + index giorni
                const date = new Date(monday);
                date.setDate(monday.getDate() + index);

                const fullName = dayNames[date.getDay()];
                const isToday = date.toDateString() === today.toDateString();

                // Aggiorna il numero e salva nome, data e chiave nel pulsante (attributi data-)
                button.querySelector('.day__number').textContent = date.getDate();
                button.dataset.name = fullName;
                button.dataset.date = date.getDate() + '/' + (date.getMonth() + 1);
                button.dataset.key = date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();
                button.dataset.today = isToday ? 'yes' : 'no';

                // Solo il giorno di oggi parte evidenziato in rosa
                button.classList.toggle('is-active', isToday);

                if (isToday) {
                    selectedDayKey = button.dataset.key;
                    dayNameText.textContent = fullName;
                    todayLabel.textContent = 'Oggi';
                }
            });
        }

        /* === DISEGNO DELLA LISTA PRODOTTI === */
        // Costruisce una card per ogni prodotto della lista
        function renderProducts() {
            productList.innerHTML = ''; // svuota la lista

            // Se non ci sono prodotti, mostra un messaggio al posto delle card
            if (products.length === 0) {
                const emptyMessage = document.createElement('li');
                emptyMessage.className = 'empty-message';
                emptyMessage.textContent = 'Nessun prodotto. Premi "+ Aggiungi" per crearne uno!';
                productList.appendChild(emptyMessage);
            }

            products.forEach(function (product) {
                const category = getCategory(product.category);

                const item = document.createElement('li');
                item.className = 'product';
                item.dataset.id = product.id; // ci serve per sapere di quale prodotto si tratta

                // La struttura della card (i testi li inseriamo dopo, in modo sicuro)
                item.innerHTML = `
          <label class="check">
            <input type="checkbox" class="check__input" aria-label="Segna come usato">
            <span class="check__circle"><span class="material-symbols-rounded">check</span></span>
          </label>
          <div class="product__icon"><span class="material-symbols-rounded icon-symbol"></span></div>
          <div class="product__info">
            <p class="product__category"></p>
            <input type="text" class="product__name name-input" placeholder="Nome prodotto" maxlength="40" aria-label="Nome del prodotto">
            <p class="product__meta"><span class="brand-text"></span> <span class="product__dot"></span> <input type="time" class="time-input" aria-label="Orario del prodotto"></p>
          </div>
                    <button class="product__menu" aria-label="Elimina prodotto"><span class="material-symbols-rounded">more_vert</span></button>
        `;

                // Riempiamo la card con i dati del prodotto
                item.querySelector('.product__icon').classList.add('product__icon--' + category.color);
                item.querySelector('.icon-symbol').textContent = category.icon;
                item.querySelector('.product__category').textContent = product.category;
                item.querySelector('.name-input').value = product.name;
                item.querySelector('.time-input').value = product.time;
                item.querySelector('.brand-text').textContent = product.brand;

                // Senza marca nascondiamo anche il puntino
                if (product.brand === '') {
                    item.querySelector('.product__dot').style.display = 'none';
                }

                productList.appendChild(item);
            });
        }

        // Crea una barra per ogni prodotto nella card progresso
        function renderSegments() {
            progressBar.innerHTML = '';

            products.forEach(function () {
                const segment = document.createElement('span');
                segment.className = 'progress__segment';
                progressBar.appendChild(segment);
            });
        }

        /* === PROGRESSO === */
        // Conta i prodotti spuntati e aggiorna contatore, percentuale e barre
        function updateProgress() {
            const checkboxes = productList.querySelectorAll('.check__input');
            const segments = progressBar.querySelectorAll('.progress__segment');
            const total = checkboxes.length;
            let doneCount = 0;

            checkboxes.forEach(function (checkbox) {
                if (checkbox.checked) {
                    doneCount = doneCount + 1;
                }
            });

            let percent = 0;
            if (total > 0) {
                percent = Math.round((doneCount / total) * 100);
            }

            counterText.textContent = doneCount + ' / ' + total + ' prodotti usati';
            percentText.textContent = percent + '%';

            // Colora tanti segmenti quanti sono i prodotti usati
            segments.forEach(function (segment, index) {
                segment.classList.toggle('is-filled', index < doneCount);
            });
        }

        /* === SALVATAGGIO SPUNTE (localStorage) === */
        // Salva gli id dei prodotti spuntati nel giorno selezionato
        function saveChecks() {
            const doneIds = [];

            productList.querySelectorAll('.check__input').forEach(function (checkbox) {
                if (checkbox.checked) {
                    doneIds.push(checkbox.closest('.product').dataset.id);
                }
            });

            localStorage.setItem('done-' + selectedDayKey, JSON.stringify(doneIds));
        }

        // Legge le spunte del giorno selezionato e le applica alla pagina
        function loadChecks() {
            const savedText = localStorage.getItem('done-' + selectedDayKey);
            let doneIds = []; // se non c'è nulla di salvato, partiamo senza spunte

            if (savedText !== null) {
                doneIds = JSON.parse(savedText);
            }

            productList.querySelectorAll('.check__input').forEach(function (checkbox) {
                const card = checkbox.closest('.product');
                checkbox.checked = doneIds.includes(card.dataset.id);
                card.classList.toggle('is-done', checkbox.checked);
            });

            updateProgress();
        }

        // Ridisegna tutto: card, barre e spunte (si usa all'avvio e dopo ogni aggiunta)
        function refreshList() {
            renderProducts();
            renderSegments();
            loadChecks();
        }

        /* === MODIFICHE NELLA LISTA (spunte, nomi, orari) === */
        // Un solo "ascoltatore" per tutta la lista: capisce cosa è cambiato guardando event.target
        function handleListChange(event) {
            const target = event.target;
            const card = target.closest('.product');
            const product = getProductById(card.dataset.id);

            if (target.classList.contains('check__input')) {
                // Spunta: aggiorna la card, il progresso e salva
                card.classList.toggle('is-done', target.checked);
                updateProgress();
                saveChecks();
            } else if (target.classList.contains('name-input')) {
                // Nome: aggiorna il prodotto e salva
                product.name = target.value;
                saveProducts();
            } else if (target.classList.contains('time-input')) {
                // Orario: aggiorna il prodotto, permette un nuovo avviso e salva
                product.time = target.value;

                const position = sentNotifications.indexOf(getTodayKey() + '-' + product.id);
                if (position !== -1) {
                    sentNotifications.splice(position, 1);
                }

                saveProducts();
                checkReminders();
            }
        }

        productList.addEventListener('change', handleListChange);

        /* === ELIMINA PRODOTTO === */
        // Quando clicchi i tre puntini chiede conferma e toglie il prodotto dalla lista
        function handleListClick(event) {
            const menuButton = event.target.closest('.product__menu');

            if (menuButton === null) {
                return; // il clic non era sui tre puntini
            }

            const card = menuButton.closest('.product');
            const product = getProductById(card.dataset.id);

            let name = product.name.trim();
            if (name === '') {
                name = 'questo prodotto'; // se il nome è vuoto
            }

            const confirmed = confirm('Vuoi eliminare "' + name + '"?');

            if (confirmed) {
                // filter crea una nuova lista senza il prodotto da eliminare
                products = products.filter(function (item) {
                    return item.id !== product.id;
                });

                saveProducts();
                refreshList();
            }
        }

        productList.addEventListener('click', handleListClick);

        /* === SELETTORE GIORNI === */
        // Rende attivo (rosa) il giorno cliccato, aggiorna le scritte e carica le sue spunte
        function selectDay(event) {
            const clickedButton = event.currentTarget;

            dayButtons.forEach(function (button) {
                button.classList.remove('is-active');
            });

            clickedButton.classList.add('is-active');
            dayNameText.textContent = clickedButton.dataset.name;

            // Se è il giorno di oggi scrive "Oggi", altrimenti la data (es. 19/10)
            if (clickedButton.dataset.today === 'yes') {
                todayLabel.textContent = 'Oggi';
            } else {
                todayLabel.textContent = clickedButton.dataset.date;
            }

            // Ricorda quale giorno è selezionato e mostra le sue spunte salvate
            selectedDayKey = clickedButton.dataset.key;
            loadChecks();
        }

        dayButtons.forEach(function (button) {
            button.addEventListener('click', selectDay);
        });

        /* === NUOVO PRODOTTO === */
        // Riempie il menu delle categorie nella finestra
        function fillCategorySelect() {
            categories.forEach(function (category) {
                const option = document.createElement('option');
                option.value = category.name;
                option.textContent = category.name;
                newCategory.appendChild(option);
            });
        }

        // Apre la finestra con i campi puliti
        function openAddDialog() {
            addForm.reset();
            addDialog.showModal();
            newName.focus();
        }

        // Quando premi "Aggiungi": crea il prodotto, lo salva e ridisegna la lista
        function handleAddSubmit(event) {
            event.preventDefault(); // evita che la pagina si ricarichi

            const name = newName.value.trim();
            if (name === '') {
                return; // niente prodotto senza nome
            }

            const newProduct = {
                id: 'p' + Date.now(), // id unico, basato sull'ora esatta
                category: newCategory.value,
                name: name,
                brand: newBrand.value.trim(),
                time: newTime.value
            };

            products.push(newProduct);
            saveProducts();
            refreshList();
            addDialog.close();
        }

        addButton.addEventListener('click', openAddDialog);
        addForm.addEventListener('submit', handleAddSubmit);
        cancelButton.addEventListener('click', function () {
            addDialog.close();
        });

        /* === NOTIFICHE === */
        // Aggiorna testo e stato del pulsante in base al permesso del browser
        function updateNotifyButton() {
            if (!('Notification' in window)) {
                notifyButton.textContent = 'Notifiche non supportate';
                notifyButton.disabled = true;
            } else if (Notification.permission === 'granted') {
                notifyButton.textContent = '🔔 Notifiche attive';
                notifyButton.disabled = true;
            } else if (Notification.permission === 'denied') {
                notifyButton.textContent = 'Notifiche bloccate (sblocca dal lucchetto)';
                notifyButton.disabled = true;
            }
        }

        // Al clic chiede il permesso al browser e manda una notifica di prova
        function handleNotifyClick() {
            Notification.requestPermission().then(function (result) {
                updateNotifyButton();
                if (result === 'granted') {
                    new Notification('Bambocchan Care', { body: 'Notifiche attivate! Ti avviserò all\'ora dei tuoi prodotti.' });
                }
            });
        }

        notifyButton.addEventListener('click', handleNotifyClick);

        // Controlla nel localStorage se il prodotto è già stato spuntato oggi
        function isProductDoneToday(productId) {
            const savedText = localStorage.getItem('done-' + getTodayKey());

            if (savedText === null) {
                return false; // nessuna spunta salvata oggi
            }

            const doneIds = JSON.parse(savedText);
            return doneIds.includes(productId);
        }

        // Trasforma "08:15" in minuti dalla mezzanotte (08:15 -> 495)
        function timeToMinutes(time) {
            const parts = time.split(':');
            return Number(parts[0]) * 60 + Number(parts[1]);
        }

        // Controlla se è l'ora di avvisare per qualche prodotto non ancora usato
        function checkReminders() {
            if (!('Notification' in window) || Notification.permission !== 'granted') {
                return; // senza permesso non facciamo niente
            }

            const now = new Date();
            const minutesNow = now.getHours() * 60 + now.getMinutes();

            products.forEach(function (product) {
                if (!product.time) {
                    return; // se l'orario è vuoto, salta questo prodotto
                }

                const minutesLate = minutesNow - timeToMinutes(product.time);
                const notificationId = getTodayKey() + '-' + product.id;

                // Avvisiamo nei 2 minuti dopo l'orario (il browser a volte rallenta i timer)
                const isTimeToNotify = minutesLate >= 0 && minutesLate <= 2;
                const alreadySent = sentNotifications.includes(notificationId);

                if (isTimeToNotify && !isProductDoneToday(product.id) && !alreadySent) {
                    let name = product.name.trim();
                    if (name === '') {
                        name = 'Il tuo prodotto'; // se hai lasciato il nome vuoto
                    }
                    new Notification('È ora della tua routine ✨', { body: name + ' (' + product.time + ')' });
                    sentNotifications.push(notificationId);
                }
            });
        }

        /* === AVVIO === */
        // All'apertura: prepara il menu categorie, carica i prodotti, sistema la settimana e disegna la lista
        fillCategorySelect();
        loadProducts();
        setupWeek();
        refreshList();
        updateNotifyButton();
        checkReminders();

        // Controlla gli orari ogni 20 secondi
        setInterval(checkReminders, 20000);
        /* === REGISTRAZIONE SERVICE WORKER === */
        // Dice al browser di registrare il nostro Service Worker all'avvio
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js')
                    .then(function (registration) {
                        console.log('Service Worker registrato con successo, scope: ', registration.scope);
                    })
                    .catch(function (error) {
                        console.log('Registrazione Service Worker fallita: ', error);
                    });
            });
        }
    </script>


</body>
