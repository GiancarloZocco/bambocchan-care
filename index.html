<!DOCTYPE html>
<html lang="it">

<head>
    <!-- Collegamento al Manifest della PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8DA1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bambocchan Care</title>

    <!-- Unica risorsa esterna: font Nunito, icone Material Symbols e Tesseract.js per OCR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        /* === VARIABILI (colori, font, raggi, ombre) === */
        :root {
            --color-page: #f3ece3;
            --color-bg: #fbf7f1;
            --color-card: #ffffff;
            --color-text: #2a2422;
            --color-text-soft: #6f6560;
            --color-rose: #d4808c;
            --color-rose-soft: #fdeef0;
            --color-gold: #d79a5b;
            --color-gold-soft: #fbf1e4;
            --color-track: #f0e8e1;
            --color-border: #f3e9e4;

            --font-main: "Nunito", system-ui, sans-serif;

            --radius-card: 20px;
            --radius-box: 16px;
            --radius-pill: 999px;

            --shadow-card: 0 4px 14px rgba(120, 90, 70, 0.08);
            --shadow-button: 0 6px 16px rgba(212, 128, 140, 0.35);
        }

        /* === BASE === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            color: var(--color-text);
            background: var(--color-page);
        }

        button {
            font-family: inherit;
            border: none;
            background: none;
            cursor: pointer;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            display: inline-block;
            user-select: none;
        }

        /* === CONTENITORE APP === */
        .app {
            max-width: 420px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px 18px 28px;
            background: var(--color-bg);
        }

        /* === HEADER === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
        }

        .header__title {
            font-size: 26px;
            font-weight: 800;
        }

        .header__subtitle {
            margin-top: 4px;
            font-size: 16px;
            color: var(--color-text-soft);
        }

        .header__profile {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--color-card);
            color: var(--color-rose);
            box-shadow: var(--shadow-card);
        }

        /* === SELETTORE GIORNI === */
        .days {
            display: flex;
            gap: 6px;
            margin-top: 22px;
        }

        .day {
            flex: 1;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border-radius: var(--radius-box);
            background: var(--color-card);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
            font-size: 12px;
            color: var(--color-text-soft);
            cursor: pointer;
        }

        .day__number {
            font-size: 17px;
            font-weight: 700;
            color: var(--color-text);
        }

        .day.is-active {
            background: var(--color-rose);
            border-color: var(--color-rose);
            color: #ffffff;
        }

        .day.is-active .day__number {
            color: #ffffff;
        }

        /* === CARD PROGRESSO === */
        .progress {
            margin-top: 20px;
            padding: 18px 18px 20px;
            border-radius: var(--radius-card);
            background: var(--color-card);
            box-shadow: var(--shadow-card);
        }

        .progress__top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-gold);
        }

        .progress__badge {
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            background: var(--color-rose-soft);
            color: var(--color-rose);
            font-size: 13px;
            font-weight: 800;
        }

        .progress__middle {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 14px;
        }

        .progress__counter {
            font-size: 21px;
            font-weight: 800;
        }

        .progress__bar-container {
            width: 100%;
            height: 8px;
            background: var(--color-track);
            border-radius: var(--radius-pill);
            margin-top: 16px;
            overflow: hidden;
        }

        .progress__bar-fill {
            height: 100%;
            width: 0%;
            background: var(--color-rose);
            transition: width 0.3s ease;
        }

        /* === BOX AVVISI === */
        .warning-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: #FFF3CD;
            color: #856404;
            border: 1px solid #FFEEBA;
            padding: 12px 16px;
            border-radius: var(--radius-card);
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* === CHECKLIST === */
        .checklist {
            margin-top: 24px;
        }

        .checklist__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .checklist__title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text-soft);
        }

        .checklist__today {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-rose);
        }

        .checklist__list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Singola card prodotto */
        .product {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: var(--radius-card);
            background: var(--color-card);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
        }

        .product__info {
            flex: 1;
            min-width: 0;
        }

        .product__name {
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            color: inherit;
            background: transparent;
            border: none;
            border-bottom: 1px dashed transparent;
            padding: 0;
        }

        .product__name:hover {
            border-bottom-color: var(--color-border);
        }

        .product__name:focus {
            outline: none;
            border-bottom: 1px solid var(--color-rose);
        }

        .product__menu {
            color: var(--color-text-soft);
            display: flex;
            cursor: pointer;
        }

        /* Checkbox personalizzata */
        .product__checkbox {
            cursor: pointer;
            display: flex;
        }

        .product__checkbox input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .product__custom-checkbox {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #f1d9dc;
            color: transparent;
            font-size: 16px;
            transition: background 0.15s, border-color 0.15s;
        }

        .product__checkbox input:checked+.product__custom-checkbox {
            background: var(--color-rose);
            border-color: var(--color-rose);
            color: #ffffff;
        }

        /* Foto prodotto */
        .product__photo-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px dashed var(--color-border);
            background: var(--color-card);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            color: var(--color-text-soft);
            transition: all 0.2s ease;
        }

        .product__photo-btn:hover {
            border-color: var(--color-rose);
            color: var(--color-rose);
        }

        .product__thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* === PULSANTE AGGIUNGI === */
        .add-button {
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            border-radius: var(--radius-pill);
            background: var(--color-rose);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            box-shadow: var(--shadow-button);
            cursor: pointer;
        }

        /* === MESSAGGIO LISTA VUOTA === */
        .empty-message {
            padding: 22px 14px;
            text-align: center;
            font-size: 14px;
            color: var(--color-text-soft);
            background: var(--color-card);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-card);
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="header">
            <div>
                <h1 class="header__title">Bambocchan Care</h1>
                <p class="header__subtitle">salve, cucciola!</p>
            </div>
            <button class="header__profile" aria-label="Profilo">
                <span class="material-symbols-rounded">person</span>
            </button>
        </header>

        <main>
            <!-- === SELETTORE GIORNI === -->
            <section class="days" aria-label="Giorni della settimana">
                <button class="day" data-day="1"><span>Lun</span><span class="day__number"></span></button>
                <button class="day" data-day="2"><span>Mar</span><span class="day__number"></span></button>
                <button class="day" data-day="3"><span>Mer</span><span class="day__number"></span></button>
                <button class="day" data-day="4"><span>Gio</span><span class="day__number"></span></button>
                <button class="day" data-day="5"><span>Ven</span><span class="day__number"></span></button>
                <button class="day" data-day="6"><span>Sab</span><span class="day__number"></span></button>
                <button class="day" data-day="0"><span>Dom</span><span class="day__number"></span></button>
            </section>

            <!-- === CARD PROGRESSO === -->
            <section class="progress" aria-label="Progresso beauty routine">
                <div class="progress__top">
                    <h2 class="label">Progresso beauty routine</h2>
                    <span class="progress__badge" id="percentage-text">0%</span>
                </div>
                <div class="progress__middle">
                    <p class="progress__counter" id="counter-text">0 / 0 prodotti usati</p>
                </div>
                <div class="progress__bar-container">
                    <div class="progress__bar-fill" id="progress-bar-fill"></div>
                </div>
            </section>

            <!-- === BOX AVVISI (Ibrido IA + Database locale) === -->
            <div id="warning-box" class="warning-box" style="display: none;">
                <span class="material-symbols-rounded">warning</span>
                <span id="warning-text">Attenzione: hai selezionato prodotti in contrasto!</span>
            </div>

            <!-- === CHECKLIST GIORNALIERA === -->
            <section class="checklist" aria-label="Checklist giornaliera">
                <div class="checklist__header">
                    <h2 class="checklist__title">Checklist giornaliera</h2>
                    <span class="checklist__today">Oggi</span>
                </div>

                <ul class="checklist__list" id="product-list"></ul>
            </section>

            <!-- === PULSANTE AGGIUNGI PRODOTTO === -->
            <button class="add-button" id="add-product-btn">+ Aggiungi prodotto</button>
        </main>
    </div>

    <script>
        /* === CONFIGURAZIONE CHIAVE API (Lascia vuota "" se vuoi usare solo il database intelligente locale) === */
        const GEMINI_API_KEY = "TUA_CHIAVE_API_GEMINI";

        /* === DATI E STATO DELL'APPLICAZIONE === */
        let products = JSON.parse(localStorage.getItem('bambocchan_products')) || [
            { id: '1', name: 'Crema idratante viso', checked: true, photo: null, ingredients: '' },
            { id: '2', name: 'Crema viso antirughe', checked: false, photo: null, ingredients: '' },
            { id: '3', name: 'Crema brufoli', checked: false, photo: null, ingredients: '' }
        ];

        /* === DATABASE LOCALE DI RISERVA (Garantito al 100%) === */
        const localActiveDB = {
            "retinolo": { name: "Retinolo", conflicts: ["brufoli", "acne", "acido salicilico", "acido glicolico"], reason: "il retinolo e i trattamenti anti-brufoli contengono attivi intensi che rischiano di irritare e danneggiare la barriera cutanea." },
            "retinol": { name: "Retinolo", conflicts: ["brufoli", "acne", "acido salicilico", "acido glicolico"], reason: "il retinolo e i trattamenti anti-brufoli contengono attivi intensi che rischiano di irritare e danneggiare la barriera cutanea." },
            "antirughe": { name: "Trattamento Antirughe", conflicts: ["brufoli", "acne", "acido salicilico", "acido glicolico"], reason: "questo abbinamento unisce trattamenti stimolanti ed esfolianti che rischiano di stressare troppo la pelle." },
            "brufoli": { name: "Trattamento Anti-Brufoli", conflicts: ["retinolo", "retinol", "antirughe"], reason: "questi prodotti contengono acidi purificanti aggressivi che non vanno sovrapposti a creme antirughe o a base di retinolo." },
            "acne": { name: "Prodotto Anti-Acne", conflicts: ["retinolo", "retinol", "antirughe"], reason: "questi trattamenti intensivi rischiano di seccare ed esfoliare eccessivamente la pelle se abbinati al retinolo." }
        };

        /* === SELETTORI DOM === */
        const productList = document.getElementById('product-list');
        const counterText = document.getElementById('counter-text');
        const percentageText = document.getElementById('percentage-text');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const addProductBtn = document.getElementById('add-product-btn');
        const warningBox = document.getElementById('warning-box');
        const warningText = document.getElementById('warning-text');

        function saveProducts() {
            localStorage.setItem('bambocchan_products', JSON.stringify(products));
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function (m) { return map[m]; });
        }

        function getProductById(id) {
            return products.find(function (item) { return item.id === id; });
        }

        function renderProducts() {
            productList.innerHTML = '';

            if (products.length === 0) {
                const emptyMessage = document.createElement('li');
                emptyMessage.className = 'empty-message';
                emptyMessage.textContent = 'Nessun prodotto. Premi "+ Aggiungi" per crearne uno!';
                productList.appendChild(emptyMessage);
                return;
            }

            products.forEach(function (product) {
                const item = document.createElement('li');
                item.className = 'product ' + (product.checked ? 'product--checked' : '');
                item.dataset.id = product.id;

                item.innerHTML = `
                    <button class="product__photo-btn" aria-label="Fotografa etichetta" title="Fotografa ingredienti">
                        ${product.photo ? `<img src="${product.photo}" class="product__thumb" alt="Foto">` : `<span class="material-symbols-rounded">photo_camera</span>`}
                    </button>
                    <input type="file" class="product__file-input" accept="image/*" capture="environment" style="display: none;">

                    <label class="product__checkbox">
                        <input type="checkbox" ${product.checked ? 'checked' : ''}>
                        <span class="product__custom-checkbox">
                            <span class="material-symbols-rounded">check</span>
                        </span>
                    </label>
                    <div class="product__info">
                        <input type="text" class="product__name" value="${escapeHtml(product.name)}" placeholder="Nome prodotto...">
                    </div>
                    <button class="product__menu" aria-label="Elimina prodotto">
                        <span class="material-symbols-rounded">more_vert</span>
                    </button>
                `;

                productList.appendChild(item);
            });
        }

        function updateCounter() {
            const total = products.length;
            const checkedCount = products.filter(function (item) { return item.checked; }).length;

            counterText.textContent = checkedCount + ' / ' + total + ' prodotti usati';
            const percentage = total > 0 ? Math.round((checkedCount / total) * 100) : 0;
            percentageText.textContent = percentage + '%';
            progressBarFill.style.width = percentage + '%';
        }

        /* === SISTEMA ibrido DI CONTROLLO (IA + DATABASE LOCALE DI SICUREZZA) === */
        async function checkConflictsHybrid() {
            const activeProducts = products.filter(function (item) { return item.checked; });

            if (activeProducts.length < 2) {
                warningBox.style.display = 'none';
                return;
            }

            // 1. Tenta prima di usare l'IA se la chiave API è inserita
            if (GEMINI_API_KEY && GEMINI_API_KEY !== "TUA_CHIAVE_API_GEMINI") {
                try {
                    warningBox.style.display = 'flex';
                    warningText.textContent = "🧠 L'IA sta analizzando la compatibilità...";

                    const productDescriptions = activeProducts.map(p => `- Nome: "${p.name}", Etichetta: "${p.ingredients || 'non specificata'}"`).join('\n');
                    const prompt = `Sei un dermatologo. Controlla questi prodotti:\n${productDescriptions}\nCi sono conflitti tra loro? Se sì, rispondi iniziando con "ATTENZIONE:" e spiega perché in italiano. Se no, rispondi "OK".`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const data = await response.json();
                    const aiReply = data.candidates[0].content.parts[0].text.trim();

                    if (aiReply.startsWith("ATTENZIONE:")) {
                        warningText.textContent = aiReply;
                        warningBox.style.display = 'flex';
                        return; // Se l'IA ha risposto, usciamo con successo
                    } else {
                        warningBox.style.display = 'none';
                        return;
                    }
                } catch (e) {
                    console.log("Connessione IA non riuscita, attivo il database di riserva locale.");
                }
            }

            // 2. Paracadute: Database locale intelligente (funziona sempre, istantaneamente e offline)
            let conflictFound = null;
            for (let i = 0; i < activeProducts.length; i++) {
                for (let j = i + 1; j < activeProducts.length; j++) {
                    const prodA = activeProducts[i];
                    const prodB = activeProducts[j];
                    const textA = (prodA.name + ' ' + (prodA.ingredients || '')).toLowerCase();
                    const textB = (prodB.name + ' ' + (prodB.ingredients || '')).toLowerCase();

                    for (let key in localActiveDB) {
                        if (textA.includes(key)) {
                            const info = localActiveDB[key];
                            for (let c = 0; c < info.conflicts.length; c++) {
                                if (textB.includes(info.conflicts[c])) {
                                    conflictFound = `⚠️ Attenzione: "${prodA.name}" (${info.name}) e "${prodB.name}" potrebbero entrare in conflitto perché ${info.reason}`;
                                    break;
                                }
                            }
                        }
                        if (conflictFound) break;
                    }
                    if (conflictFound) break;
                }
                if (conflictFound) break;
            }

            if (conflictFound) {
                warningText.textContent = conflictFound;
                warningBox.style.display = 'flex';
            } else {
                warningBox.style.display = 'none';
            }
        }

        function refreshList() {
            renderProducts();
            updateCounter();
            checkConflictsHybrid();
        }

        /* === SELETTORE GIORNI === */
        const dayButtons = document.querySelectorAll('.day');
        const todayDate = new Date();
        const currentDayOfWeek = todayDate.getDay();
        const currentDayOfMonth = todayDate.getDate();

        dayButtons.forEach(function (dayBtn) {
            const dayIndex = parseInt(dayBtn.getAttribute('data-day'));
            const numberSpan = dayBtn.querySelector('.day__number');
            let diff = dayIndex - currentDayOfWeek;
            const targetDate = new Date(todayDate);
            targetDate.setDate(currentDayOfMonth + diff);

            numberSpan.textContent = targetDate.getDate();
            dayBtn.classList.remove('is-active');

            if (dayIndex === currentDayOfWeek) {
                dayBtn.classList.add('is-active');
            }

            dayBtn.addEventListener('click', function () {
                dayButtons.forEach(function (btn) { btn.classList.remove('is-active'); });
                dayBtn.classList.add('is-active');
            });
        });

        /* === GESTIONE EVENTI SULLA LISTA === */
        productList.addEventListener('click', function (event) {
            const photoBtn = event.target.closest('.product__photo-btn');
            if (photoBtn) {
                const card = photoBtn.closest('.product');
                const fileInput = card.querySelector('.product__file-input');
                fileInput.click();
                return;
            }

            const menuButton = event.target.closest('.product__menu');
            if (menuButton) {
                const card = menuButton.closest('.product');
                const product = getProductById(card.dataset.id);
                let name = product.name.trim() || 'questo prodotto';

                if (confirm('Vuoi eliminare "' + name + '"?')) {
                    products = products.filter(function (item) { return item.id !== product.id; });
                    saveProducts();
                    refreshList();
                }
            }
        });

        productList.addEventListener('change', function (event) {
            const checkboxInput = event.target.closest('input[type="checkbox"]');
            if (checkboxInput) {
                const card = checkboxInput.closest('.product');
                const product = getProductById(card.dataset.id);
                product.checked = checkboxInput.checked;
                saveProducts();
                refreshList();
                return;
            }

            const nameInput = event.target.closest('.product__name');
            if (nameInput) {
                const card = nameInput.closest('.product');
                const product = getProductById(card.dataset.id);
                product.name = nameInput.value;
                saveProducts();
                refreshList();
                return;
            }

            const fileInput = event.target.closest('.product__file-input');
            if (fileInput) {
                const file = fileInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const card = fileInput.closest('.product');
                        const product = getProductById(card.dataset.id);
                        product.photo = e.target.result;
                        saveProducts();
                        refreshList();

                        // Legge il testo dell'etichetta con OCR
                        Tesseract.recognize(e.target.result, 'eng').then(function ({ data: { text } }) {
                            product.ingredients = text;
                            saveProducts();
                            refreshList();
                            alert('Etichetta analizzata per: ' + product.name);
                        });
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        addProductBtn.addEventListener('click', function () {
            const newProduct = {
                id: Date.now().toString(),
                name: 'Nuovo prodotto',
                checked: false,
                photo: null,
                ingredients: ''
            };
            products.push(newProduct);
            saveProducts();
            refreshList();
        });

        refreshList();
    </script>
</body>

</html>
